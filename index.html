<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Joga na Cumbuca</title>
<meta name="description" content="Cartas aleatórias para jogos de improviso.">
<meta name="theme-color" content="#23302D">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">

  <button class="dice-badge" id="dice-badge" aria-label="Sortear personagem e localização">
    <img src="assets/icons/dice.svg" alt="">
  </button>

  <div class="screens" id="screens">

    <section class="screen" id="screen-inicio">
      <div class="ticket-card ticket-card--dark">
        <span class="dot"></span>
        <div class="wordmark"><img src="assets/logo.svg" alt="Joga na Cumbuca"></div>
        <button class="btn btn--accent" id="btn-iniciar">INICIAR</button>
      </div>
    </section>

    <section class="screen" id="screen-categoria">
      <div class="ticket-card ticket-card--white">
        <span class="dot"></span>
        <div class="ticket-card__brand js-go-home"><img src="assets/icons/brand-icon-on-white.svg" alt="Joga na Cumbuca"></div>
        <div class="category-nav">
          <button id="cat-up" aria-label="Categoria anterior"><img src="assets/icons/chevron-up.svg" alt=""></button>
          <h1 class="ticket-card__title category-name" id="category-name"></h1>
          <button id="cat-down" aria-label="Próxima categoria"><img src="assets/icons/chevron-down.svg" alt=""></button>
        </div>
        <div class="btn-row">
          <button class="btn btn--accent" id="btn-sortear-categoria">SORTEAR</button>
          <button class="btn btn--accent" id="btn-lista">LISTA</button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-jogo">
      <div class="ticket-card ticket-card--accent">
        <span class="dot"></span>
        <div class="ticket-card__brand js-go-home"><img src="assets/icons/brand-icon-on-accent.svg" alt="Joga na Cumbuca"></div>
        <h1 class="ticket-card__title" id="game-title"></h1>
        <div class="tag-row" id="game-tags"></div>
        <hr class="divider">
        <p class="game-description" id="game-description"></p>
        <div class="btn-row">
          <button class="btn btn--dark btn--pill-icon" id="btn-resortear" aria-label="Sortear outro jogo">
            <img src="assets/icons/shuffle.svg" alt="">
          </button>
          <button class="btn btn--dark btn--wide" id="btn-opcoes">+ OPÇÕES</button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-lista">
      <div class="ticket-card ticket-card--accent ticket-card--plain">
        <h1 class="list-title">LISTA DE JOGOS</h1>
        <div class="category-select-wrap" style="width:100%;position:relative;">
          <select class="category-select" id="category-select"></select>
          <img src="assets/icons/chevron-down.svg" alt="" style="position:absolute;right:2px;top:8px;pointer-events:none;">
        </div>
        <div class="legend">
          <span><img src="assets/icons/tag-aquecimento.svg" alt="">Aquecimento</span>
          <span><img src="assets/icons/tag-mediador.svg" alt="">Precisa de Mediador</span>
          <span><img src="assets/icons/tag-participantes.svg" alt="">Número de Participantes</span>
        </div>
        <ul class="game-list" id="game-list"></ul>
        <div class="btn-row">
          <button class="btn btn--dark btn--wide" id="btn-aleatorio">ALEATÓRIO</button>
          <button class="btn btn--dark btn--icon" id="btn-fechar-lista" aria-label="Fechar lista">X</button>
        </div>
      </div>
    </section>

  </div>

  <div class="footer-carousel">
    <div class="footer-carousel__track">
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
      <div class="footer-card"><img src="assets/icons/brand-icon-on-dark.svg" alt=""></div>
    </div>
  </div>

  <div class="dice-overlay" id="dice-overlay">
    <div class="dice-overlay__panel">
      <div class="dice-overlay__head">
        <img src="assets/icons/dice.svg" alt="">
        <h2>SORTEAR DE NOVO</h2>
        <button class="dice-overlay__close" id="dice-overlay-close" aria-label="Fechar">X</button>
      </div>
      <hr class="dice-overlay__divider">
      <div class="dice-overlay__cols">
        <div class="dice-overlay__col">
          <span>Local</span>
          <button id="btn-local">Local aleatório</button>
        </div>
        <div class="dice-overlay__col">
          <span>Personagem</span>
          <button id="btn-personagem">Personagem Aleatório</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="assets/js/app.js"></script>
</body>
</html>
